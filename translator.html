<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Language Translation Tool</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --success: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
      overflow: hidden;
    }
    header {
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      padding: 20px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.5rem; font-weight: 600; }
    .content { padding: 28px; }
    .lang-row {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .lang-group {
      flex: 1;
      min-width: 200px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    select, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    select:focus, textarea:focus { border-color: var(--accent); }
    textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }
    .swap-btn {
      align-self: flex-end;
      margin-bottom: 6px;
      background: #334155;
      border: none;
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }
    .swap-btn:hover { background: var(--accent); color: #0f172a; }
    .actions {
      display: flex;
      gap: 12px;
      margin: 18px 0;
      flex-wrap: wrap;
    }
    button.primary {
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    button.primary:hover { transform: translateY(-1px); }
    button.primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .secondary {
      background: #334155;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .secondary:hover { background: #475569; }
    .result-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 18px;
      min-height: 120px;
      position: relative;
    }
    .result-box .label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    #output {
      font-size: 1.15rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: var(--muted);
      min-height: 20px;
    }
    .status.error { color: #f87171; }
    .status.success { color: var(--success); }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <span style="font-size:1.8rem">🌐</span>
      <h1>Language Translation Tool</h1>
    </header>

    <div class="content">
      <!-- Language selectors -->
      <div class="lang-row">
        <div class="lang-group">
          <label>Source Language</label>
          <select id="sourceLang">
            <option value="auto">Detect language</option>
            <option value="en" selected>English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="tr">Turkish</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
          </select>
        </div>

        <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>

        <div class="lang-group">
          <label>Target Language</label>
          <select id="targetLang">
            <option value="en">English</option>
            <option value="es" selected>Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="pt">Portuguese</option>
            <option value="ru">Russian</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="ja">Japanese</option>
            <option value="ko">Korean</option>
            <option value="ar">Arabic</option>
            <option value="hi">Hindi</option>
            <option value="tr">Turkish</option>
            <option value="nl">Dutch</option>
            <option value="pl">Polish</option>
          </select>
        </div>
      </div>

      <!-- Input -->
      <label for="inputText">Enter text to translate</label>
      <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>

      <div class="actions">
        <button class="primary" id="translateBtn">Translate</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>

      <!-- Output -->
      <div class="result-box">
        <div class="label">Translation</div>
        <div id="output">Your translated text will appear here…</div>
        <div class="btn-row">
          <button class="secondary" id="copyBtn">📋 Copy</button>
          <button class="secondary" id="speakBtn">🔊 Speak</button>
        </div>
      </div>

      <div class="status" id="status"></div>
    </div>
  </div>

  <script>
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');
    const inputText  = document.getElementById('inputText');
    const output     = document.getElementById('output');
    const status     = document.getElementById('status');
    const translateBtn = document.getElementById('translateBtn');
    const clearBtn   = document.getElementById('clearBtn');
    const copyBtn    = document.getElementById('copyBtn');
    const speakBtn   = document.getElementById('speakBtn');
    const swapBtn    = document.getElementById('swapBtn');

    // ---- Translation via MyMemory (free, no key needed for light use) ----
    async function translate() {
      const text = inputText.value.trim();
      if (!text) {
        status.textContent = 'Please enter some text.';
        status.className = 'status error';
        return;
      }

      const sl = sourceLang.value;
      const tl = targetLang.value;
      if (sl === tl && sl !== 'auto') {
        status.textContent = 'Source and target languages are the same.';
        status.className = 'status error';
        return;
      }

      translateBtn.disabled = true;
      status.textContent = 'Translating…';
      status.className = 'status';
      output.textContent = '…';

      try {
        // MyMemory free endpoint
        const langpair = `${sl === 'auto' ? 'autodetect' : sl}|${tl}`;
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langpair}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.responseStatus === 200 || data.responseData?.translatedText) {
          const translated = data.responseData.translatedText;
          // Filter out quota warning messages
          if (translated.includes('MYMEMORY WARNING')) {
            throw new Error('Daily free quota reached. Try again later or use another service.');
          }
          output.textContent = translated;
          status.textContent = 'Translation successful';
          status.className = 'status success';
        } else {
          throw new Error(data.responseDetails || 'Translation failed');
        }
      } catch (err) {
        output.textContent = '';
        status.textContent = 'Error: ' + err.message;
        status.className = 'status error';
        console.error(err);
      } finally {
        translateBtn.disabled = false;
      }
    }

    // ---- Event listeners ----
    translateBtn.addEventListener('click', translate);
    inputText.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key === 'Enter') translate();
    });

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      output.textContent = 'Your translated text will appear here…';
      status.textContent = '';
    });

    copyBtn.addEventListener('click', async () => {
      const text = output.textContent;
      if (!text || text.startsWith('Your translated')) return;
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = 'Copied to clipboard!';
        status.className = 'status success';
      } catch {
        status.textContent = 'Copy failed';
        status.className = 'status error';
      }
    });

    speakBtn.addEventListener('click', () => {
      const text = output.textContent;
      if (!text || text.startsWith('Your translated')) return;
      if (!('speechSynthesis' in window)) {
        status.textContent = 'Text-to-speech not supported in this browser.';
        status.className = 'status error';
        return;
      }
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = targetLang.value === 'zh-CN' ? 'zh-CN' : targetLang.value;
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    });

    swapBtn.addEventListener('click', () => {
      const s = sourceLang.value;
      const t = targetLang.value;
      if (s === 'auto') return;
      sourceLang.value = t;
      targetLang.value = s;
      // also swap texts if translation exists
      const out = output.textContent;
      if (out && !out.startsWith('Your translated')) {
        inputText.value = out;
        output.textContent = '';
      }
    });
  </script>
</body>
</html>
